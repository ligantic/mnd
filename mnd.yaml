- abbreviated_name: Survivability
  allow_multiple: false
  calculation: |-
    function pluralise(singular, actual) {
      return actual + ' ' + singular + (actual > 1 ? 's' : '');
    }

    function stringify(days, months, years) {
      var date_string = '';

      if (years > 0) {
        date_string += pluralise('year', years);
      }

      if (months > 0) {
        date_string += (date_string ? ', ' : '') + pluralise('month', months);
      }

      if (days > 0) {
        date_string += (date_string ? ', ' : '') + pluralise('day', days);
      }

      return date_string;
    }

    function convert(ms) {
      var DAYS_IN_MONTH = 30.47;
      var DAYS_IN_YEAR = 365;
      var MONTHS_IN_YEAR = 12;
      var days = ms/1000/60/60/24;
      var months = Math.floor(days/DAYS_IN_MONTH);
      var years = Math.floor(days/DAYS_IN_YEAR);


      if (years >=1 ){
        months = months - (years * MONTHS_IN_YEAR);
        days = days - (years * DAYS_IN_YEAR);
      }

      if (months >= 1) {
        days = days - (months * DAYS_IN_MONTH);
      }

      days = Math.round(days);

      return stringify(days, months, years);

    }

    var reason = context.mndDMode;
    var firstVisit = patient.clinicalData.clinicVisitsCFG.firstVisit;

    if (reason === "completeReasonChoice2" && firstVisit) {

      var dateOfDeath = context.mndDOD;
      var firstVisitDate = firstVisit.mndPresentingDetails.mndOnset;

      if (!firstVisitDate) {
        firstVisitDate = firstVisit.mndPresentingDetails.mndDateConfirm;
      }

      if (dateOfDeath && firstVisitDate) {
        var parsedDOD = Date.parse(dateOfDeath.split("-").reverse());
        var parsedFVD = Date.parse(firstVisitDate.substring(0, 10));
        var duration = Math.abs(parsedDOD - parsedFVD);

        context.result = convert(duration);
      }

    }

    if (!context.result) {
      context.result = "N/A";
    }
  calculation_query: |-
    clinicalData {
      clinicVisitsCFG {
        firstVisit {
          mndPresentingDetails { mndOnset mndDateConfirm }
        }
      }
    }
  code: mndSurvivability
  datatype: calculated
  desc: Patient survivability
  important: false
  instructions: Patient survivability
  is_required: false
  max_length: null
  max_value: null
  min_value: null
  name: Survivability
  pattern: ''
  pv_group: null
  widget_name: ''
  widget_settings: '{}'
