- abbreviated_name: My ESS Score
  allow_multiple: false
  calculation: |-
    var ess1 = parseInt(context.mndESSSit, 10);
    var ess2 = parseInt(context.mndESSTV, 10);
    var ess3 = parseInt(context.mndESSPublic, 10);
    var ess4 = parseInt(context.mndESSPassenger, 10);
    var ess5 = parseInt(context.mndESSLying, 10);
    var ess6 = parseInt(context.mndESSSitNTalk, 10);
    var ess7 = parseInt(context.mndESSSitNoDrink, 10);
    var ess8 = parseInt(context.mndESSTraffic, 10);

    var essScore = ess1 + ess2 + ess3 + ess4 + ess5 + ess6 + ess7 + ess8;

    context.result = essScore || 0;
