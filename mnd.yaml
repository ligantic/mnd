- abbreviated_name: ALSFRS  Score
  allow_multiple: false
  calculation: |-
    var als1 = parseInt(context.mndSpeechCLN, 10);
    var als2 = parseInt(context.mndSalivaCLN, 10);
    var als3 = parseInt(context.mndSwallow, 10);
    var als4 = parseInt(context.mndWriting, 10);
    var als5 = parseInt(context.mndGasCut, 10);
    var als5A = parseInt(context.mndNoGasCut, 10);
    var als6 = parseInt(context.mndALSDress, 10);
    var als7 = parseInt(context.mndBed, 10);
    var als8 = parseInt(context.mndWalk, 10);
    var als9 = parseInt(context.mndStairs, 10);
    var als10 = parseInt(context.mndBreathing, 10);
    var als11 = parseInt(context.mndLayBreath, 10);
    var als12 = parseInt(context.mndResp, 10);
    var gastroGate = (als5 || als5A);

    var alsFRS = als1 + als2 + als3 + als4 + gastroGate + als6 + als7 + als8 + als9 + als10 + als11 +als12;

    context.result = alsFRS || 0;
  calculation_query: ''
  code: mndALSFRS
  datatype: calculated
  desc: ''
  important: false
  instructions: Please answer all of the questions in the ALS-FRS Score Calculator
    to reveal your score.
  is_required: false
  max_length: null
  max_value: null
  min_value: null
