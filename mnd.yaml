- abbreviated_name: BMI
  allow_multiple: false
  calculation: |-
    var height = parseFloat(context.mndHeight) / 100.0;
    var weight = parseFloat(context.mndWeight);
    function roundToTwo(num) {
      return +(Math.round(num + "e+2") + "e-2");
    }
    var bmi = weight / (height * height);
    var rounded = roundToTwo(bmi);
    context.result = isNaN(rounded) ? "": rounded;
  calculation_query: ''
