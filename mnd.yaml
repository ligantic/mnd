- abbreviated_name: RFCAF
  applicability_condition: ''
  conditional_rendering_rules: CDEQ11aCAF visible if CDEQ11CAF == Yes
  display_name: Carer's Support Needs
  header: ''
  name: RFCAF
  position: 0
  sections:
  - abbreviated_name: SECTCAF
    allow_multiple: false
    code: SECTCAF
    display_name: IDENTIFYING AND ASSESSING YOUR NEEDS AS A FAMILY CARER
    elements:
    - DTEPCKR
    - ChooseState
    - CDEQ1CAF
    - CDEQ2CAF
    - CDEQ3CAF
    - CDEQ4CAF
    - CDEQ5CAF
    - CDEQ6CAF
    - CDEQ7CAF
    - CDEQ8CAF
    - CDEQ9CAF
    - CDEQ10CAF
    - CDEQ12CAF
    - CDEQ11CAF
    - CDEQ11aCAF
    extra: null
    header: |-
      The following questionnaire has been designed to help you and your MND advisor to better understand your support needs as a family carer. <br> </br>
      Please answer each of the questions so you can receive support that is specific to your own needs. <br> </br>
      Once you have completed this online form, you will be prompted to contact your MND advisor to review your responses and develop an action plan together.  <br> </br>

      <i> (This online form is based on the “Carer’s Alert Thermometer (CAT): A triage tool to identify the needs of family carers and plan support” Version 5, published by Edge Hill University. It has been adapted to allow family carers to complete the CAT Tool online for ease of use).    </i>
      <br> </br>
  - abbreviated_name: SECTCAFII
    allow_multiple: false
    code: SECTCAFII
    display_name: MAKE A SUPPORT ACTION PLAN TOGETHER WITH YOUR MND ADVISOR
    elements:
    - ADVCTC
    - StateTerr
    extra: null
    header: |-
      <h5> Please see your MND Advisor to make a plan together </h5><br> </br>

      <b>Option 1 - Example</b> <br></br>

      For MND Association QLD, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association NSW, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association VIC, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association WA, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association SA,  Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association TAS, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association ACT, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      For MND Association NT, Contact (xx) xxx xxx or xxxx@xxx.xxx<br> </br>
      <br>
      </br>
  tags: []
