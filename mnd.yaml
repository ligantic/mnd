    <p>If this is your <strong>first time filling out this section</strong>, download and print <a href="https://www.mindaus.org/wp-content/uploads/2022/05/09124953/MindausFirstVisitCRFExternalNeurologistApril2022V01.pdf">this <strong>first visit</strong> form </a>
